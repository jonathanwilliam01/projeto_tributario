<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Atalhos Tributário agora é Atalhos Embras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#293135">
  <script>
    // Leva para o Atalhos Embras a tela aberta e os favoritos e recentes deste endereço.
    (function () {
      var destino = 'https://atalhos-embras.vercel.app/';
      var telasRenomeadas = { transparencia: 'inscritos-divida' };

      function ler(chave) {
        try {
          var valor = JSON.parse(localStorage.getItem(chave) || '[]');
          return Array.isArray(valor) ? valor : [];
        } catch (e) {
          return [];
        }
      }

      var dados = { favoritos: ler('linksFavoritos'), recentes: ler('linksRecentes') };
      var importar = dados.favoritos.length || dados.recentes.length ? '?importar=' + encodeURIComponent(JSON.stringify(dados)) : '';
      // Importa uma vez só: depois daqui os favoritos ficam no Atalhos Embras.
      try {
        localStorage.removeItem('linksFavoritos');
        localStorage.removeItem('linksRecentes');
      } catch (e) {}

      var tela = decodeURIComponent(location.hash.slice(1));
      tela = telasRenomeadas[tela] || tela;
      location.replace(destino + importar + (tela ? '#' + encodeURIComponent(tela) : ''));
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #293135; color: #e9e9e9; font-family: sans-serif; text-align: center; }
    a { color: #4ac2c2; }
  </style>
</head>
<body>
  <p>O Atalhos Tributário agora faz parte do <a href="https://atalhos-embras.vercel.app/">Atalhos Embras</a>.</p>
</body>
</html>
